name: ci
on:
  push: { branches: [main], paths-ignore: ["**.md", "LICENSE"] }
  pull_request: { paths-ignore: ["**.md", "LICENSE"] }
jobs:
  # No containers: type-check, bundle, unit tests (+ the file-based SQLite IT,
  # which runs without a server), and the VS Code activation smoke test.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: xvfb-run -a npm run test:vscode

  # Which engines get an integration job — only the adapters this release ships
  # (ENABLED_ADAPTER_IDS in src/adapters/registry.ts). A disabled adapter reaches
  # no user, so booting its container on every push burns minutes for nothing.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: node .github/scripts/integration-matrix.mjs >> "$GITHUB_OUTPUT"

  # Live-container integration, one engine per job — the heavy images (SQL Server,
  # Cassandra, Elasticsearch, …) can't all co-reside on a single runner, so each
  # boots only its own container and runs only that adapter's IT.
  integration:
    needs: matrix
    if: needs.matrix.outputs.include != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: integration (${{ matrix.engine }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run db:start -- ${{ matrix.db }}
      - run: npm run db:seed -- ${{ matrix.db }}
      - run: TUPLEBASE_IT=1 npx vitest run ${{ matrix.tests }}

name: Bug report
description: Something in TupleBase is broken or behaving unexpectedly
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can — connection details can be redacted, but the engine and versions matter a lot.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error messages (copy them verbatim).
      placeholder: Running a query against ... fails with ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a connection to ...
        2. Open the explorer and ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      description: Which engine were you connected to when the bug occurred?
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQLite
        - SQL Server
        - MongoDB
        - Redis
        - Cassandra
        - ClickHouse
        - Elasticsearch
        - DynamoDB
        - Neo4j
        - Other / not engine-specific
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connections / configuration
        - Explorer tree
        - Query editor / results
        - MCP server
        - Secrets / authentication
        - Other
    validations:
      required: false
  - type: input
    id: extension-version
    attributes:
      label: TupleBase version
      description: Shown in the VS Code Extensions view.
      placeholder: e.g. 0.4.2
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: From Code → About Visual Studio Code.
      placeholder: e.g. 1.102.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.5, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Output from the TupleBase output channel or Developer Tools console. Redact hostnames and credentials.
      render: shell
    validations:
      required: false
